[package]
name = "dsheng-core"
description = "dsheng 两表一单本地经营分析工具共享 Rust 核心（桌面 Tauri 与 CLI 复用）"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
# 数据工作包：表格读取（xlsx/xls）与 CSV
calamine = "0.38"
csv = "1"
# Provider 工作包：HTTP（仅 HTTPS/回环；禁重定向）与 JSON Schema Draft 2020-12 校验
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
jsonschema = { version = "0.60", default-features = false }

[dev-dependencies]
tempfile = "3"
