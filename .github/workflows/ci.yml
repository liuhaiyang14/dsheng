# CI 骨架（S5）：Linux/macOS 构建矩阵 + 测试；不发布、不调用 Provider。
#
# 边界（主计划 §12.1 / 发布工作包任务书）：
# - CI 永不调用 Provider/模型（无任何网络模型请求、无 Mock Provider）。
# - CI 不做发布：不打 tag、不上传产物到 Release、不部署。GitHub Release
#   与二进制发布须产品验收通过 + 用户显式授权后由用户/主 Agent 手动执行
#   （发布物料见 docs/release/README.md 与 RELEASE-CHECKLIST.md）。
# - 桌面 .dmg 打包（scripts/package/macos.sh）在 CI 只做编译级验证
#   （--no-bundle）；签名与 bundler 分发产物不属于 CI 职责。
#
# 矩阵（docs/specs/provider-config-delivery.md §6）：
# - ubuntu-latest：cargo fmt --check + clippy + test（根 workspace）
# - macos-14(arm64)：cargo test + src-ui（npm ci/build/vitest）+ src-tauri
#   实前端编译（tauri build --no-bundle）
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 主计划 §10.2/交付合同 §6：macOS 13 起
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fmt: true
          - os: macos-14 # arm64
            fmt: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ matrix.os }}-
      - name: cargo fmt --check
        if: matrix.fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # 发布前检查（secrets 扫描；清单核对在无产物时自动降级为告警）
      - name: preflight
        run: scripts/package/preflight.sh --skip-manifest

  ui:
    name: src-ui (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: npm ci
        run: npm --prefix src-ui ci
      - name: build（tsc --noEmit + vite build）
        run: npm --prefix src-ui run build
      - name: vitest
        run: npm --prefix src-ui test

  desktop-macos:
    name: src-tauri build (macos-14 arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-macos-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: tauri-macos-
      - name: npm ci + build（真实前端，非 placeholder）
        run: |
          npm --prefix src-ui ci
          npm --prefix src-ui run build
      # manifest-path 构建：src-tauri 被根 workspace exclude，须单独构建。
      # 用 tauri CLI --config 覆盖 frontendDist（同 scripts/package/macos.sh），
      # 验证真实前端资产可嵌入桌面二进制；beforeBuildCommand 置 null 置空
      # （npm build 已在上一步执行，避免 CLI 在仓库根重复/错位执行）；
      # --no-bundle：CI 不产 .dmg（不发布）。
      - name: tauri build --no-bundle（编译级验证，不产安装包）
        run: |
          npx --yes --package @tauri-apps/cli@2 tauri build --no-bundle \
            --config '{"build":{"frontendDist":"../src-ui/dist","beforeBuildCommand":null}}'
        working-directory: src-tauri
      - name: cargo test（src-tauri 集成测试，用例 40/S5 合同）
        run: cargo test --manifest-path src-tauri/Cargo.toml
