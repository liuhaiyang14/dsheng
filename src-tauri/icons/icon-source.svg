<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#253129"/>
      <stop offset="1" stop-color="#141A15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECD08A"/>
      <stop offset="1" stop-color="#C09749"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="220" fill="none" stroke="#3B4A3E" stroke-width="5"/>

  <!-- 角落双表纹样（弱化装饰） -->
  <g stroke="#D7B46E" fill="none" stroke-width="10" opacity="0.18" stroke-linecap="round">
    <rect x="118" y="118" width="252" height="170" rx="26"/>
    <line x1="118" y1="186" x2="370" y2="186"/>
    <line x1="118" y1="254" x2="370" y2="254"/>
    <line x1="244" y1="118" x2="244" y2="288"/>
    <rect x="654" y="736" width="252" height="170" rx="26"/>
    <line x1="654" y1="804" x2="906" y2="804"/>
    <line x1="654" y1="872" x2="906" y2="872"/>
    <line x1="780" y1="736" x2="780" y2="906"/>
  </g>

  <!-- 主字：盛（视觉居中，基线 ≈ 700） -->
  <text x="512" y="700" font-family="Songti SC, PingFang SC, STSong, serif" font-size="440"
        font-weight="700" fill="url(#gold)" text-anchor="middle">盛</text>
</svg>
